name: Tests

# pytest and changed-line coverage, skipped when a PR or push only changes non-code paths:
# pre-commit (pre-commit.yml) still runs on those. Add a path only if nothing the tests run reads it.
# A skipped workflow leaves its checks pending, so if `test` becomes a required check,
# switch to a job-level filter that reports "skipped" instead.
on:
  push:
    branches:
      - main
    paths-ignore: &non-code
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "cliff.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pr-title.yml"
      - ".github/workflows/pre-commit.yml"
  pull_request:
    branches:
      - "*"
    paths-ignore: *non-code


jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares against origin/main
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install  -e '.[dev]'

      - name: Run tests
        run: python -m pytest tests --doctest-modules --cov=dram_rules --cov-report=xml --cov-report=html

      # Every changed line must run in some test: an untested branch, or a test
      # passing through a different check than the one it targets, fails here.
      - name: Coverage of changed lines
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: ./coverage.xml
